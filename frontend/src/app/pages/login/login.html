<div class="w-full max-w-md p-8 bg-white rounded-2xl shadow-xl">
  <h1 class="text-2xl font-bold text-center text-slate-900 mb-8">LOGIN</h1>

  <form class="space-y-6">
    <div>
      <label for="username" class="block text-sm font-medium text-slate-700 mb-2"> Username </label>
      <input
        id="username"
        type="text"
        autocomplete="username"
        class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-900 focus:border-transparent outline-none transition-shadow"
        placeholder="Enter your username"
      />
      <!-- <app-form-errors></app-form-errors> -->
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-slate-700 mb-2"> Password </label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-900 focus:border-transparent outline-none transition-shadow"
        placeholder="Enter your password"
      />
      <!-- <app-form-errors></app-form-errors> -->
    </div>

    <button
      size="lg"
      appButton
      type="submit"
      class="w-full"
    >
      LOGIN
    </button>

    <p class="text-sm text-center text-slate-500 mt-4">
      Don't have an account?
      <a routerLink="/register" class="text-blue-500 font-medium underline"> Register </a>
    </p>
  </form>
</div>
